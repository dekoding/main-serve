name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Run tests
        run: cargo test --verbose

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build .deb package
        run: cargo deb --no-build

      - name: Build .rpm package
        run: cargo generate-rpm

      - name: Generate checksums
        run: |
          cd target
          sha256sum release/main-serve > SHA256SUMS
          sha256sum debian/*.deb >> SHA256SUMS
          sha256sum generate-rpm/*.rpm >> SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/release/main-serve
            target/SHA256SUMS

      - name: Extract version
        id: version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Extracted version: $version"

      - name: Update PKGBUILD version
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" dist/arch/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" dist/arch-bin/PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' dist/arch/PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' dist/arch-bin/PKGBUILD

      - name: Push PKGBUILD to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: main-serve
          pkgbuild: dist/arch/PKGBUILD
          updpkgsums: true
          assets: |
            dist/arch/main-serve.install
            dist/main-serve.service
            dist/main-serve.sysusers
            dist/main-serve.tmpfiles

          commit_username: dekoding
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
