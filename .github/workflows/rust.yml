name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test-sqlite:
    name: Test (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --verbose

  test-postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: main_serve_test
          POSTGRES_USER: main_serve
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U main_serve -d main_serve_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test db_backends --test db_api_features --test db_migrations --test auth --test hot_reload -- --test-threads=1
        env:
          TEST_BACKENDS: postgres
          TEST_POSTGRES_URL: postgres://main_serve:${{ github.run_id }}@127.0.0.1:5432/main_serve_test

  test-mysql:
    name: Test (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: main_serve_test
          MYSQL_USER: main_serve
          MYSQL_PASSWORD: ${{ github.run_id }}
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u main_serve -p${{ github.run_id }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test db_backends --test db_api_features --test db_migrations --test auth --test hot_reload -- --test-threads=1
        env:
          TEST_BACKENDS: mysql
          TEST_MYSQL_URL: mysql://main_serve:${{ github.run_id }}@127.0.0.1:3306/main_serve_test

  packaging:
    name: Validate packaging
    runs-on: ubuntu-latest
    needs: [check, fmt, clippy, test-sqlite, test-postgres, test-mysql]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo install cargo-deb cargo-generate-rpm
      - name: Build .deb
        run: cargo deb --no-build
      - name: Build .rpm
        run: cargo generate-rpm
      - name: Validate PKGBUILD syntax
        run: bash -n dist/PKGBUILD
