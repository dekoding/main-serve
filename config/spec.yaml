# yaml-language-server: $schema=./main-serve.schema.json
# =============================================================================
# Main Serve - Full YAML Configuration Specification
# =============================================================================
#
# This file documents every configurable field in a Main Serve YAML config.
# Each field includes its type, default value, and valid options.
#
# ENVIRONMENT VARIABLE INTERPOLATION:
#   Any string value supports ${ENV_VAR} and ${ENV_VAR:-default} syntax.
#   This is resolved at config load time. Use this for secrets.
#   Example: password: "${DB_PASSWORD}"
#            password: "${DB_PASSWORD:-changeme}"
#
# REQUEST CONTEXT INTERPOLATION:
#   Certain fields (like `where_clause`) support dynamic interpolation
#   using the `${key}` syntax to inject request-specific data.
#   Supported keys:
#     - ${request.user.id}: The authenticated user's ID.
#     - ${request.user.role}: The authenticated user's role.
#     - ${request.headers.NAME}: The value of a specific request header.
#   Example: where_clause: "author_id = ${request.user.id}"
#
# FILE INCLUDES ($include directive):
#   Split large configs across multiple files using $include.
#   Paths are relative to the file containing the directive.
#   Glob patterns (e.g. "endpoints/*.yaml") are supported.
#
#   In a sequence (e.g. endpoints list):
#     endpoints:
#       - $include: "endpoints/users.yaml"        # single file
#       - $include: "endpoints/*.yaml"             # glob: one item per match
#       - path: "/inline"                          # inline entries still work
#         action: custom_response
#
#   In a mapping (e.g. databases, tables):
#     databases:
#       $include: "db/databases.yaml"              # replaces the mapping
#     tables:
#       $include: "tables/*.yaml"                  # merges all matches
#
#   Includes can be nested. Circular includes are detected and rejected.
#   Included files also support ${ENV_VAR} interpolation.
#
#   In cases of collisions (e.g. two tables with the same name), the last
#   included file takes precedence.
#
# =============================================================================

# -----------------------------------------------------------------------------
# SERVER SETTINGS
# -----------------------------------------------------------------------------
server:
  # Bind address for the HTTP listener.
  # Type: string
  # Default: "127.0.0.1"
  host: "127.0.0.1"

  # Port number for the HTTP listener.
  # Type: integer (1-65535)
  # Default: 8080
  port: 8080

  # Number of tokio worker threads. Set to 0 or omit for tokio default (num CPUs).
  # Type: integer (0 = auto)
  # Default: 0 (auto)
  workers: 0

  # Maximum request body size in bytes. Requests exceeding this are rejected with 413.
  # Not applied to file uploads - those are configured per-endpoint under their action config.
  # Not applied to proxied requests - those are configured under proxy.max_response_size.
  # Type: integer
  # Default: 10485760 (10 MiB)
  max_body_size: 10485760

  # HTTP keep-alive timeout in seconds. 0 disables keep-alive.
  # When > 0, idle keep-alive connections are closed after this many seconds
  # without a new request (implemented via hyper's header_read_timeout).
  # Type: integer
  # Default: 75
  keep_alive: 75

  # Graceful shutdown timeout in seconds.
  # After receiving SIGTERM/SIGINT, in-flight requests have this long to complete.
  # Type: integer
  # Default: 30
  shutdown_timeout: 30

  # TLS configuration. Omit this section entirely to serve plain HTTP.
  tls:
    # Path to PEM-encoded certificate file.
    # Type: string (file path)
    # Required if tls section is present.
    cert: "/path/to/cert.pem"

    # Path to PEM-encoded private key file.
    # Type: string (file path)
    # Required if tls section is present.
    key: "/path/to/key.pem"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging:
  # Log level: trace, debug, info, warn, error.
  # Type: enum (string)
  # Default: "info"
  level: "info"

  # Output format: "json" or "pretty".
  # Type: enum (string)
  # Default: "pretty"
  format: "pretty"

  # Whether to log request bodies (can be verbose / contain sensitive data).
  # Bodies are logged at the DEBUG level. Bodies larger than 16 KiB are
  # truncated in the log output. The body is buffered in memory for logging
  # and then replayed to the handler, so enabling this adds memory overhead.
  # Type: boolean
  # Default: false
  log_request_body: false

  # Whether to log response bodies.
  # Bodies are logged at the DEBUG level. Bodies larger than 16 KiB are
  # truncated in the log output. The response body is buffered in memory
  # for logging before being sent to the client.
  # Type: boolean
  # Default: false
  log_response_body: false

  # Maximum body size (in bytes) that will be included in log output.
  # Bodies larger than this are truncated. Applies to both request and
  # response body logging.
  # Type: integer (bytes)
  # Default: 16384 (16 KiB)
  max_body_log_size: 16384

# -----------------------------------------------------------------------------
# CORS (Global defaults - can be overridden per-endpoint)
# -----------------------------------------------------------------------------
cors:
  # Allowed origins. Use ["*"] to allow all. Empty or omitted = no cross-origin access.
  # Type: list of strings
  # Default: [] (no cross-origin access by default)
  allowed_origins: []

  # Allowed HTTP methods.
  # Type: list of strings (GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD)
  # Default: [] (inherited from allowed_origins pattern or explicit config)
  allowed_methods: []

  # Allowed request headers.
  # Type: list of strings
  # Default: [] (inherited from allowed_origins pattern or explicit config)
  allowed_headers: []

  # Whether to allow credentials (cookies, authorization headers).
  # Type: boolean
  # Default: false
  allow_credentials: false

  # Max age for preflight cache in seconds.
  # Type: integer
  # Default: 86400 (24 hours)
  max_age: 86400

# -----------------------------------------------------------------------------
# RATE LIMITING (Global defaults - can be overridden per-endpoint)
# -----------------------------------------------------------------------------
rate_limit:
  # Whether rate limiting is enabled globally.
  # Type: boolean
  # Default: false
  enabled: false

  # Maximum number of requests per window.
  # Type: integer
  # Default: 100
  max_requests: 100

  # Window duration in seconds.
  # Type: integer
  # Default: 60
  window_seconds: 60

  # Key extraction strategy: "ip", "header", "token".
  #   - ip: rate limit by client IP
  #   - header: rate limit by value of a specific header (set key_header)
  #   - token: rate limit by auth token / API key
  # Type: enum (string)
  # Default: "ip"
  key_strategy: "ip"

  # Header name to use when key_strategy is "header".
  # Type: string
  # Default: "" (unused unless key_strategy is "header")
  key_header: ""

  # Number of tracked client entries before triggering cleanup of expired entries.
  # Increase for high-traffic deployments with many unique clients.
  # Type: integer
  # Default: 10000
  cleanup_threshold: 10000

# -----------------------------------------------------------------------------
# DATABASES
# Named database connections. At least one is required for CRUD endpoints.
# -----------------------------------------------------------------------------
databases:
  # Each key is a unique name used to reference this database in endpoints.
  # Example:
  main:
    # Database driver: postgres, mysql, sqlite.
    # Type: enum (string)
    # Required.
    driver: "postgres"

    # Connection string / URL.
    # Type: string (use ${ENV_VAR} for secrets)
    # Required.
    url: "${DATABASE_URL}"

    # Minimum number of connections in the pool.
    # Type: integer
    # Default: 1
    min_connections: 1

    # Maximum number of connections in the pool.
    # Type: integer
    # Default: 10
    max_connections: 10

    # Whether to run auto-migrations on startup/reload for tables that
    # reference this database.
    # Type: boolean
    # Default: true
    auto_migrate: true

    # Whether auto-migration is allowed to drop columns that exist in the
    # database but are no longer present in the YAML config.
    # When false (the default), removed columns are logged as warnings but
    # left untouched - no data is lost.
    # When true, columns missing from the YAML config will be dropped from
    # the database via ALTER TABLE ... DROP COLUMN. THIS IS DESTRUCTIVE and
    # cannot be undone.
    # Type: boolean
    # Default: false
    allow_destructive: false

    # Pool connection acquire timeout in seconds.
    # How long to wait for a connection from the pool before returning an error.
    # Type: integer (seconds)
    # Default: 5
    acquire_timeout: 5

# -----------------------------------------------------------------------------
# TABLE SCHEMAS
# Define array of database tables. Used for auto-migration and CRUD query
# generation.
#
# Each table consists of the table name, the database it belongs to, and an
# array of column definitions. Columns have a name, type, and optional
# constraints.
# -----------------------------------------------------------------------------
tables:
  # Each entry defines a database table.
  - name: "users"
    # Which named database this table belongs to (must match a key in `databases`).
    # Type: string
    # Required.
    database: "main"

    # Column definitions. Every table must have at least one primary key column.
    # Type: list of objects
    # Required.
    columns:
      # Each column is defined as:
      #   - name: column name in the database
      #   - type: SQL data type
      #   - primary_key: whether this is the primary key (boolean, default: false)
      #   - nullable: whether NULL is allowed (boolean, default: true; always false for PKs)
      #   - default: default SQL expression (string, optional)
      #   - unique: whether to create a UNIQUE constraint (boolean, default: false)
      #   - indexed: whether to create an index (boolean, default: false)
      - name: "id"
        # Column data type. Supported types:
        #   integer, bigint, smallint, serial, bigserial,
        #   text, varchar, char,
        #   boolean,
        #   float, double, decimal,
        #   date, timestamp, timestamptz,
        #   uuid, json, jsonb,
        #   blob / bytea
        # Type: enum (string)
        # Required.
        type: "serial"

        # Whether this column is the primary key.
        # Type: boolean
        # Default: false
        primary_key: true

        # Whether this column can be NULL.
        # Type: boolean
        # Default: true (primary key columns are always treated as NOT NULL
        # in the generated DDL regardless of this setting)
        nullable: false

        # Default SQL expression for this column.
        # Type: string (optional)
        # Example: "now()", "'active'", "0"
        default: null

        # Whether to create a UNIQUE constraint.
        # Type: boolean
        # Default: false
        unique: false

        # Whether to create an index on this column.
        # Type: boolean
        # Default: false
        indexed: false

      - name: "email"
        type: "varchar"
        unique: true
        nullable: false
        indexed: true

      - name: "password_hash"
        type: "text"
        nullable: false

      - name: "role"
        type: "varchar"
        nullable: false
        default: "'user'"

      - name: "created_at"
        type: "timestamptz"
        nullable: false
        default: "now()"

      - name: "updated_at"
        type: "timestamptz"
        nullable: false
        default: "now()"

    # Foreign key constraints.
    # Type: list of objects (optional)
    # Each object has: column, references_table, references_column, on_delete, on_update
    foreign_keys: []
    #  - column: "org_id"
    #    references_table: "organizations"
    #    references_column: "id"
    #    on_delete: "cascade"    # cascade, set_null, restrict, no_action
    #    on_update: "cascade"

# -----------------------------------------------------------------------------
# AUTHENTICATION (Global auth provider definitions)
# Define named auth providers. Endpoints reference these by name.
# -----------------------------------------------------------------------------
auth:
  # JWT authentication provider.
  jwt:
    # Secret key for HMAC signing, or path to public key for RSA/EC.
    # Type: string (use ${ENV_VAR})
    # Required if jwt is configured.
    secret: "${JWT_SECRET}"

    # JWT algorithm: HS256, HS384, HS512, RS256, RS384, RS512, ES256, ES384.
    # Type: enum (string)
    # Default: "HS256"
    algorithm: "HS256"

    # Token issuer (iss claim).
    # Type: string
    # Default: "main-serve"
    issuer: "main-serve"

    # Expected audience (aud claim). Optional.
    # Type: string
    # Default: "" (not validated if empty)
    audience: ""

    # Token expiry duration in seconds.
    # Type: integer
    # Default: 3600 (1 hour)
    expiry: 3600

    # Name of the claim that contains the user's role.
    # Type: string
    # Default: "role"
    role_claim: "role"

    # Token revocation configuration. When set, JWTs with a `jti` claim
    # are checked against the revocation store before being accepted.
    # Type: object (optional)
    # Omit or set revocation: null to disable token revocation.
    revocation:
      # Store type: "in_memory" or "database".
      # Type: enum (string)
      # Default: "in_memory"
      store: "in_memory"

      # Database table name for the revocation store (only when store is "database").
      # Type: string (optional)
      # Default: "token_blacklist"
      db_table: "token_blacklist"

      # Interval in seconds between cleanup runs for expired revocation entries.
      # Only applicable for "database" store.
      # Type: integer (optional)
      # Default: 3600
      cleanup_interval_secs: 3600

  # API key authentication.
  api_key:
    # Where to look for the API key: "header" or "query".
    # Type: enum (string)
    # Default: "header"
    location: "header"

    # Header name or query parameter name.
    # Type: string
    # Default: "X-API-Key"
    name: "X-API-Key"

    # List of valid API keys (use ${ENV_VAR} for each).
    # Each key can optionally have a role attached.
    # Type: list of objects
    # Each object has: key (string), role (string, optional)
    keys:
      - key: "${API_KEY_1}"
        role: "admin"
      - key: "${API_KEY_2}"
        role: "reader"

  # HTTP Basic authentication.
  basic:
    # Realm string returned in WWW-Authenticate header.
    # Type: string
    # Default: "main-serve"
    realm: "main-serve"

    # List of username/password pairs (passwords are argon2 hashes).
    # Type: list of objects
    # Each object has: username (string), password_hash (string), role (string, optional)
    users:
      - username: "admin"
        password_hash: "${ADMIN_PASSWORD_HASH}"
        role: "admin"

  # OAuth2 / OpenID Connect authentication.
  # Supports two modes:
  #   1. Token introspection: validate externally-obtained Bearer tokens via
  #      userinfo_url. Endpoints use `auth: "oauth2"`.
  #   2. Authorization code flow (with PKCE): Main Serve redirects users to
  #      the IdP for login, exchanges the code for tokens, fetches user info,
  #      mints a Main Serve JWT, and sets it as an HttpOnly cookie. This
  #      bridges OAuth2 into the existing JWT auth model. Requires auth.jwt
  #      to be configured alongside oauth2.
  #
  #   Code flow endpoints (registered automatically when authorization_url is set):
  #     GET /_main-serve/oauth2/authorize  - redirects to IdP
  #     GET /_main-serve/oauth2/callback   - handles IdP callback
  oauth2:
    # OAuth2 provider name (for logging/identification).
    # Type: string
    provider: "generic"

    # Authorization endpoint URL (IdP's login page).
    # When set, enables the OAuth2 authorization code flow and registers
    # the /_main-serve/oauth2/authorize and callback endpoints.
    # Type: string (URL)
    # Default: "" (code flow disabled)
    authorization_url: ""

    # Token endpoint URL (where the code is exchanged for tokens).
    # Required when authorization_url is set.
    # Type: string (URL)
    token_url: ""

    # UserInfo endpoint URL (OIDC).
    # Used to validate bearer tokens (mode 1) and to fetch user info
    # after code exchange (mode 2). Returns JSON with "sub" and optional
    # "role" fields.
    # Type: string (URL)
    userinfo_url: ""

    # Client ID registered with the OAuth2 provider.
    # Required when authorization_url is set.
    # Type: string (use ${ENV_VAR})
    client_id: "${OAUTH2_CLIENT_ID}"

    # Client secret registered with the OAuth2 provider.
    # Type: string (use ${ENV_VAR})
    client_secret: "${OAUTH2_CLIENT_SECRET}"

    # OAuth2 scopes to request during the authorization code flow.
    # Type: list of strings
    # Default: ["openid"]
    scopes:
      - "openid"
      - "profile"
      - "email"

    # Callback URL that the IdP redirects to after authentication.
    # Must match the redirect URI registered with the OAuth2 provider.
    # Required when authorization_url is set.
    # Type: string (URL)
    redirect_url: "http://localhost:8080/_main-serve/oauth2/callback"

    # URL to redirect the user to after successful OAuth2 login.
    # Type: string (URL path or full URL)
    # Default: "/"
    success_url: "/"

    # Name of the HttpOnly cookie set after a successful OAuth2 login.
    # Contains the minted JWT. The JWT auth middleware also checks this
    # cookie, so endpoints with `auth: "jwt"` work seamlessly after login.
    # Type: string
    # Default: "main_serve_token"
    cookie_name: "main_serve_token"

    # Maximum lifetime (in seconds) for a pending OAuth2 authorization state.
    # States older than this are expired and rejected during the callback.
    # Type: integer (seconds)
    # Default: 300 (5 minutes)
    state_ttl: 300

    # Maximum number of pending OAuth2 authorization flows allowed simultaneously.
    # Limits memory usage from concurrent or abandoned authorization flows.
    # Type: integer
    # Default: 1000
    max_pending_states: 1000

    # OAuth2 role mapping configuration. When set, IdP roles/groups from
    # the userinfo response are mapped to Main Serve roles.
    # Type: object (optional)
    role_mapping:
      # Default Main Serve role when no IdP role maps.
      # Type: string
      # Default: "user"
      default_role: "user"

      # Name of the claim in the userinfo response containing IdP roles/groups.
      # Type: string
      # Default: "groups"
      role_claim: "groups"

      # Mapping from IdP role/group values to Main Serve roles.
      # Type: map of string to string
      # Example:
      #   "admin-group": "admin"
      #   "editor-group": "editor"
      #   "viewer-group": "user"
      role_map:
        "admin-group": "admin"
        "editor-group": "editor"
        "viewer-group": "user"

      # How to match IdP roles against the role_map keys.
      # Type: enum (string)
      # Default: "exact"
      match_mode: "exact"

  # User registration configuration.
  # Enables self-service user registration with password-based auth.
  # Type: object (optional)
  # Omit or set register: null to disable registration.
  register:
    # Whether registration is enabled.
    # Type: boolean
    # Default: false
    enabled: true

    # Database table to create users in.
    # Type: string
    # Required when enabled.
    table: "users"

    # Named database to use.
    # Type: string
    # Required when enabled.
    database: "main"

    # Default role assigned to newly registered users.
    # Type: string
    # Default: "user"
    default_role: "user"

    # Password hashing algorithm.
    # Type: enum (string)
    # Default: "argon2id"
    password_hash: "argon2id"

# -----------------------------------------------------------------------------
# STORAGE BACKENDS
# Named storage backends. Endpoints that need file storage reference these by key.
# -----------------------------------------------------------------------------
stores:
  # Each key is a unique name used to reference this store in endpoints.
  # Duplicate store names are a configuration error (fail-fast at load time).
  # Error: Duplicate store name "X" in stores section
  #
  # At most one backend-specific config section (root, s3, azure, gcs) may be
   # present. The `backend` value must match the present config section
   # (e.g., `backend: s3` requires an `s3:` block). Validation fails with an
   # error if conflicting, mismatched, or empty config is detected.
   #
   # Required fields per backend:
   #   native -> root (must not be empty)
   #   memory -> none (no additional config needed)
   #   s3     -> s3.region, s3.bucket, s3.access_key, s3.secret_key (all required);
   #            s3.endpoint and s3.force_path_style are optional
   #   azure  -> azure.account_name, azure.account_key, azure.container (all required)
   #   gcs    -> gcs.project_id, gcs.credentials, gcs.bucket (all required)
  #
  # Example:
  local_assets:
    # Storage backend type: "native" (local disk), "s3" (Amazon S3),
    # "azure" (Azure Blob Storage), "gcs" (Google Cloud Storage),
    # "memory" (in-memory for testing, no config needed).
    # Type: enum (string)
    # Required.
    backend: "native"

    # Root directory for local storage. Required when backend is "native",
    # must not be empty.
    # Type: string (directory path)
    root: "./public"

    # S3 configuration. Required when backend is "s3".
    # Type: object (optional)
    # s3:
    #   region: "us-east-1"
    #   bucket: "myapp-assets"
    #   access_key: "${S3_ACCESS_KEY}"
    #   secret_key: "${S3_SECRET_KEY}"
    #   endpoint: ""           # optional custom endpoint URL for S3-compatible services
    #   force_path_style: false  # true for MinIO, LocalStack, Ceph; false (default) for AWS S3
    #                            # path-style: s3.amazonaws.com/bucket-key; virtual-hosted: bucket.s3.amazonaws.com

    # Azure Blob Storage configuration. Required when backend is "azure".
    # Type: object (optional)
    # azure:
    #   account_name: "${AZURE_ACCOUNT}"
    #   account_key: "${AZURE_KEY}"
    #   container: "assets"

    # Google Cloud Storage configuration. Required when backend is "gcs".
    # Type: object (optional)
    # gcs:
    #   project_id: "my-project"
    #   credentials: "${GCS_CREDENTIALS}"
    #   bucket: "myapp-assets"

  media_storage:
    backend: "s3"
    s3:
      region: "us-west-2"
      bucket: "myapp-media"
      access_key: "${S3_ACCESS_KEY}"
      secret_key: "${S3_SECRET_KEY}"
      force_path_style: false

  video_storage:
    backend: "native"
    root: "/var/media/video"

  # In-memory store for testing - no additional config required.
  # Useful for unit tests or development where persistence is not needed.
  test_store:
    backend: "memory"

# -----------------------------------------------------------------------------
# ENDPOINTS
# The core of Main Serve: define API routes, file serving, media management, etc.
#
# Each endpoint entry has these top-level fields:
#   - path: URL path pattern. Supports {param} (e.g. /users/{id}) for single-segment
#     path parameters, and /* (e.g. /assets/*) for trailing wildcard capture.
#   - methods: list of HTTP methods this endpoint responds to.
#   - action: the endpoint's behavior type (see action enum below).
#   - <action-specific config>: object whose structure depends on the action type.
#   - auth: auth provider name or "none". Inherited from global config if omitted.
#   - roles: allowed roles. Inherited from global config if omitted.
#   - cors: per-endpoint CORS override. Omit to inherit from global config.
#   - rate_limit: per-endpoint rate limit override. Omit to inherit from global config.
#
# Action types:
#   crud          - database CRUD operations (select, insert, update, delete)
#   proxy         - forward requests to an upstream HTTP service
#   static_files  - serve files directly from a storage backend
#   media         - media library with management features (upload, trash, sharing, etc.)
#   file_store    - database-backed file catalog with CRUD (no direct file serving)
#   spa_host      - serve a single-page application with fallback routing
#   custom_response - return a static response body
# -----------------------------------------------------------------------------
endpoints:
  # Each endpoint is an entry in this list.

  # ---- CRUD Endpoint Example ----
  - path: "/api/users"
    # HTTP methods this endpoint responds to.
    # Type: list of strings (GET, POST, PUT, PATCH, DELETE)
    # Required.
    methods:
      - "get"
      - "post"

    # Action type (see enum above).
    # Type: enum (string)
    # Required.
    action: "crud"

    # CRUD-specific configuration (required when action is "crud").
    crud:
      # Which table to operate on (must match a key in `tables`).
      # Type: string
      # Required.
      table: "users"

      # Which named database to use (must match a key in `databases`).
      # Type: string
      # Required.
      database: "main"

      # Fields to return in GET responses. Use ["*"] for all.
      # Type: list of strings
      # Default: ["*"]
      fields:
        - "id"
        - "email"
        - "role"
        - "created_at"

      # Fields that are writable on POST/PUT/PATCH. Omit to allow all non-PK fields.
      # Type: list of strings (optional)
      writable_fields:
        - "email"
        - "password_hash"
        - "role"

      # Enable pagination on GET list endpoints.
      # Type: object (optional)
      pagination:
        # Whether pagination is enabled.
        # Type: boolean
        # Default: true
        enabled: true

        # Default page size.
        # Type: integer
        # Default: 20
        default_page_size: 20

        # Maximum allowed page size.
        # Type: integer
        # Default: 100
        max_page_size: 100

      # Enable filtering on GET list endpoints (query parameters become WHERE clauses).
      # If filtering is enabled on a JSONB column, the API supports dot-notation and LHS brackets syntax for filtering on nested fields.
      # Dot-notation example: ?metadata.role=admin
      # LHS brackets example: ?metadata[role]=admin
      # Type: object (optional)
      filtering:
        # Whether filtering is enabled.
        # Type: boolean
        # Default: true
        enabled: true

        # Columns that can be filtered on.
        # Type: list of strings. Use ["*"] for all.
        # Default: ["*"]
        allowed_fields:
          - "email"
          - "role"
          - "created_at"

      # Enable sorting on GET list endpoints (?sort=field&order=asc).
      # If sorting is enabled on a JSONB column, the API supports dot-notation and LHS brackets syntax for sorting on nested fields.
      # Dot-notation example: ?sort=metadata.role&order=asc
      # LHS brackets example: ?sort=metadata[role]&order=asc
      # Type: object (optional)
      sorting:
        # Whether sorting is enabled.
        # Type: boolean
        # Default: true
        enabled: true

        # Default sort field.
        # Type: string
        # Default: primary key
        default_field: "created_at"

        # Default sort order: "asc" or "desc".
        # Type: enum (string)
        # Default: "asc"
        default_order: "desc"

        # Fields that can be sorted on.
        # Type: list of strings. Use ["*"] for all.
        # Default: ["*"]
        allowed_fields:
          - "id"
          - "email"
          - "created_at"

      # WHERE clause applied to all queries on this endpoint.
      #   Can be static (e.g. "deleted_at IS NULL") or dynamic
      #   with interpolation (e.g. "author_id = ${request.user.id}").
      # Type: string
      # Example: "deleted_at IS NULL"
      # Default: null (no filter)
      where_clause: null

      # WHERE clause applied specifically to UPDATE queries on this endpoint.
      #   Can be static (e.g. "status = 'published'") or dynamic
      #   with interpolation (e.g. "author_id = ${request.user.id}").
      #   This is combined with the global where_clause using AND.
      # Type: string
      # Example: "author_id = ${request.user.id}"
      # Default: null (no additional filter)
      update_where_clause: null

      # WHERE clause applied specifically to DELETE queries on this endpoint.
      #   Can be static (e.g. "status = 'draft'") or dynamic
      #   with interpolation (e.g. "author_id = ${request.user.id}").
      #   This is combined with the global where_clause using AND.
      # Type: string
      # Example: "author_id = ${request.user.id}"
      # Default: null (no additional filter)
      delete_where_clause: null

      # Column to automatically populate with the authenticated user's ID
      # on INSERT (POST) requests. The value of ${request.user.id} is used.
      # This is applied before the INSERT statement is executed.
      # If the column already has a value in the request body, that value
      # takes precedence.
      # Type: string
      # Example: "author_id"
      # Default: null (no automatic owner assignment)
      insert_owner: null

      # Joins with other tables.
      # Type: list of objects (optional)
      # Each object has: table, on, join_type, fields
      # Note that "on" is a YAML 1.2 implicit boolean
      # type, so it must be in quotes.
      joins: []
      #  - table: "organizations"
      #    "on": "users.org_id = organizations.id"
      #    join_type: "left"    # inner, left, right
      #    fields:
      #      - "organizations.name as org_name"

      # Computed / virtual fields (SQL expressions).
      # Type: list of objects (optional)
      # Each object has: name, expression
      computed_fields: []
      #  - name: "full_name"
      #    expression: "first_name || ' ' || last_name"

    # Authentication provider name or "none".
    # Type: string
    # Default: "none"
    auth: "jwt"
    # Allowed roles. Inherited from global config if omitted.
    roles:
      - "admin"
      - "user"

    # Per-endpoint CORS override (same shape as global cors).
    # Omit to inherit from global config.
    # Type: object (optional)
    cors: null

    # Per-endpoint rate limiting override (same shape as global rate_limit).
    # Omit to inherit from global config.
    # Type: object (optional)
    rate_limit: null


  # ---- CRUD Endpoint with path parameter (single resource) ----
  - path: "/api/users/{id}"
    # HTTP methods this endpoint responds to.
    # Type: list of strings (GET, POST, PUT, PATCH, DELETE)
    # Required.
    methods:
      - "get"
      - "put"
      - "delete"

    # Action type.
    # Type: enum (string)
    # Required.
    action: "crud"
    crud:
      # Which table to operate on (must match a key in `tables`).
      # Type: string
      # Required.
      table: "users"

      # Which named database to use (must match a key in `databases`).
      # Type: string
      # Required.
      database: "main"

      # Fields to return in GET responses. Use ["*"] for all.
      # Type: list of strings
      # Default: ["*"]
      fields:
        - "id"
        - "email"
        - "role"
        - "created_at"

      # Fields that are writable on POST/PUT/PATCH. Omit to allow all non-PK fields.
      # Type: list of strings (optional)
      writable_fields:
        - "email"
        - "role"
    # Authentication provider name or "none".
    # Type: string
    # Default: "none"
    auth: "jwt"
    # Allowed roles.
    roles:
      - "admin"

  # ---- Proxy Endpoint Example ----
  - path: "/api/external/*"
    # HTTP methods this endpoint responds to.
    # Type: list of strings (GET, POST, PUT, PATCH, DELETE)
    # Required.
    methods:
      - "get"
      - "post"
      - "put"
      - "delete"

    # Action type.
    # Type: enum (string)
    # Required.
    action: "proxy"

    # Proxy-specific configuration (required when action is "proxy").
    proxy:
      # Upstream base URL to forward requests to.
      # Type: string (URL)
      # Required.
      upstream: "https://api.example.com"

      # Path rewrite rules.
      # Type: object (optional)
      path_rewrite:
        # Strip this prefix from the request path before forwarding.
        # Type: string
        strip_prefix: "/api/external"

        # Prepend this prefix to the path before forwarding.
        # Type: string
        add_prefix: "/v2"

      # Headers to add to the upstream request.
      # Type: map of string to string
      # Default: {}
      headers:
        X-Forwarded-For: "client"
        Authorization: "Bearer ${UPSTREAM_TOKEN}"

      # Timeout settings in seconds.
      # Type: object
      timeouts:
        # Connect timeout.
        # Type: integer
        # Default: 5
        connect: 5

        # Read timeout.
        # Type: integer
        # Default: 30
        read: 30

        # Maximum total time for the proxied request.
        # Type: integer
        # Default: 60
        total: 60

      # Maximum upstream response body size in bytes.
      # Responses exceeding this limit are rejected to prevent memory exhaustion.
      # Set to 0 to disable the limit.
      # Type: integer (bytes)
      # Default: 268435456 (256 MiB)
      max_response_size: 268435456

    # Authentication provider name or "none".
    # Type: string
    # Default: "none"
    auth: "api_key"

  # ---- Media Library Example ----
  # Full media library with metadata tracking, uploads, trash, sharing,
  # and image resizing. Serving files from the store is inherent to this
  # action -- no `serve_files` flag is needed.
  # Requires a database table for metadata and a storage backend for files.
  - path: "/media"
    # HTTP methods this endpoint responds to.
    # Type: list of strings (GET, POST, PUT, PATCH, DELETE)
    # Required.
    methods:
      - "get"
      - "post"
      - "patch"
      - "delete"

    # Action type.
    # Type: enum (string)
    # Required.
    action: "media"
    media:
      # Which named store to use (must match a key in `stores`).
      # Type: string
      # Required.
      # Validation: referenced store must exist in `stores`; fails at config load time
      storage: "media_storage"

      # Database table for media metadata.
      # Type: string
      # Required.
      # Validation: referenced table must exist in `tables`; fails at config load time
      table: "media_items"

      # Which named database to use (must match a key in `databases`).
      # Type: string
      # Required.
      # Validation: referenced database must exist in `databases`; fails at config load time
      database: "main"

      # All cross-reference validation (stores, tables, databases, auth providers)
      # occurs at config-load time (fail-fast). No lazy/validation-at-request
      # validation for structural references.

      # Tracked metadata presets. Each preset expands to specific SQL columns:
      #   "auto" - original_name=text, mime_type=text, size=bigint,
      #            uploader_id=uuid, created_at=timestamptz, updated_at=timestamptz
      #   "tags" - jsonb column (default: null); API-level treated as string array
      #   "description" - text column (default: null)
      #   "alt_text" - text column (default: null)
      #   "content_type" - varchar column with check constraint:
      #      allowed values: image, video, audio, document, other
      # Type: list of strings
      # Default: ["auto"]
      columns:
        - "auto"
        - "tags"

      # Additional columns not covered by presets. Same structure as tables.columns
      # but without primary_key, unique, or indexed constraints.
      # NOT supported (ignored if present): primary_key, unique, indexed,
      #   check, foreign_key
      # Type: list of objects (optional)
      # Each object has: name (string), type (string), nullable (boolean, default: true),
      #   default (string, optional)
      metadata_columns:
        - name: "license"
          type: "text"
          nullable: true
          default: "''"

      # -----------------------------------------------------------------------
      # Upload (inherent to media action)
      # -----------------------------------------------------------------------

      # Upload configuration.
      # Type: object (optional)
      upload:
        # Maximum upload size in bytes.
        # Type: integer
        # Default: 104857600 (100 MiB)
        max_size: 104857600

        # Allowed file extensions (empty = all extensions allowed).
        # Type: list of strings (beginning with dots)
        # Default: [] (all extensions)
        allowed_extensions:
          - ".jpg"
          - ".jpeg"
          - ".png"
          - ".gif"
          - ".webp"
          - ".pdf"
          - ".mp4"
          - ".mp3"

        # MIME type filtering (empty = all MIME types allowed).
        # Type: list of strings
        # Default: [] (all MIME types)
        allowed_mime_types: []

        # MIME type detection method: "extension" or "magic".
        # Type: enum (string)
        # Default: "magic"
        mime_detection: "magic"

        # Whether bulk upload (multipart/mixed) is supported.
        # Type: boolean
        # Default: true
        bulk_supported: true

        # Subdirectory pattern for organizing uploads.
        # Available placeholders: {user_id}, {year}, {month}, {day}, {uuid}
        # Type: string
        # Default: null (files stored at root of store)
        create_subdirectory: "{user_id}/{year}/{month}"

        # File versioning.
        # Type: object (optional)
        # Omit or set enabled: false to disable versioning.
        versioning:
          enabled: false
          max_versions: 10

        # Preview generation for non-image files.
        # Type: object (optional)
        # Omit or set enabled: false to disable preview generation.
        preview_generation:
          enabled: false
          previews:
            - name: "thumbnail"
              max_width: 200
              max_height: 200
              format: "webp"

      # -----------------------------------------------------------------------
      # File Move
      # -----------------------------------------------------------------------

      # Move configuration. Omit to disable move operations.
      # Type: object (optional)
      move:
        # Whether move operations are enabled. Defaults to true when section is present.
        # Type: boolean
        # Default: true (when section is present)
        enabled: true

        # Admin users can move files anywhere in the store.
        # Non-admin users can only move within their own directory tree.
        # Type: boolean
        # Default: true
        admin_override: true

        # Auto-create destination directory if it doesn't exist.
        # Type: boolean
        # Default: false
        auto_create_destination: false

      # -----------------------------------------------------------------------
      # File Rename
      # -----------------------------------------------------------------------

      # Rename configuration. Omit to disable rename operations.
      # Type: object (optional)
      rename:
        # Whether rename operations are enabled. Defaults to true when section is present.
        # Type: boolean
        # Default: true (when section is present)
        enabled: true

        # Admin users can rename any file.
        # Non-admin users can only rename their own files.
        # Type: boolean
        # Default: true
        admin_override: true

      # -----------------------------------------------------------------------
      # File Delete
      # -----------------------------------------------------------------------

      # Delete configuration. Omit to disable delete operations.
      # Type: object (optional)
      delete:
        # Whether delete operations are enabled. Defaults to true when section is present.
        # Type: boolean
        # Default: true (when section is present)
        enabled: true

        # Admin users can delete any file.
        # Non-admin users can only delete their own files.
        # Type: boolean
        # Default: true
        admin_override: true

      # -----------------------------------------------------------------------
      # User Scoping
      # -----------------------------------------------------------------------

      # User scoping configuration. Omit to disable user-level scoping.
      # Type: object (optional)
      user_scope:
        # Whether user scoping is enabled. Defaults to true when section is present.
        # Type: boolean
        # Default: true (when section is present)
        enabled: true

        # Scoping mode:
        #   "user"   - users see only their own uploads, manage only their own files
        #   "shared" - all authenticated users see all files, but manage only their own
        #   "open"   - no user restrictions, role-based access only
        # Type: enum (string)
        # Default: "shared"
        mode: "shared"

        # Roles that bypass user scoping entirely.
        # Type: list of strings
        # Default: []
        admin_roles:
          - "admin"
          - "editor"

        # Whether users can browse directories they don't own but are publicly
        # accessible (e.g., /media/shared/).
        # Type: boolean
        # Default: false
        allow_cross_user_browse: false

      # -----------------------------------------------------------------------
      # Content Entity Integration
      # -----------------------------------------------------------------------

      # Content references configuration. Omit to disable content entity integration.
      # Type: object (optional)
      content_references:
        # Whether content references are enabled. Defaults to true when section is present.
        # Type: boolean
        # Default: true (when section is present)
        enabled: true

        # The association table name (auto-created at startup during migration).
        # Type: string
        # Default: "media_entity_refs"
        table: "media_entity_refs"

        # Column names in the association table.
        # Type: strings
        media_id_column: "media_id"
        entity_id_column: "entity_id"
        content_type_column: "content_type"
        order_column: "attachment_order"

        # Auto-created table schema:
        #   id         - bigserial/bigint PRIMARY KEY
        #   media_id   - bigint NOT NULL, FK to <media_table>.id
        #   entity_id  - bigint NOT NULL (references any content entity)
        #   content_type - varchar NOT NULL
        #   attachment_order - integer NOT NULL DEFAULT 0
        #   Constraints: UNIQUE (media_id, entity_id, content_type)

        # Which content entity types can reference this media.
        # When null, all content types can reference.
        # Type: list of strings or null
        # Default: null
        allowed_content_types: null

        # Behavior when media is deleted and is attached to entities.
        #   "detach"   - removes only the association row matching the deleted
        #                content entity; other associations for the same media
        #                remain intact
        #   "cascade"  - deletes the association row, the media DB row, and
        #                the storage file
        #   "error"    - refuses to delete if media is attached to any entity;
        #                returns HTTP 409 Conflict with JSON body listing
        #                attached entity references
        # Type: enum (string)
        # Default: "detach"
        on_delete: "detach"

      # -----------------------------------------------------------------------
      # Trash / Recycle Bin
      # -----------------------------------------------------------------------

      # Trash configuration. Omit or set enabled: false to disable trash.
      # Type: object (optional)
      trash:
        # Whether trash is enabled. Deleted files are moved to trash instead of
        # being permanently removed.
        # Type: boolean
        # Default: false
        enabled: true

        # Number of days to retain trashed files.
        # Type: integer
        # Default: 14
        retention_days: 14

        # Store prefix for trashed files.
        # Trashed files are MOVED to {store_root}/{prefix}/{user_scope_path}/{original_file_path}.
        # The full user-scoped path is preserved in trash.
        # Type: string
        # Default: ".trash"
        prefix: ".trash"

        # Whether to expose trash management endpoints:
        #   GET    /_main-serve/media/trash       - list trashed files
        #   POST   /_main-serve/media/trash/{id}/restore  - restore a file
        #   DELETE /_main-serve/media/trash/{id}   - permanently delete
        #   DELETE /_main-serve/media/trash       - empty trash
        # Type: boolean
        # Default: true
        management_endpoints: true

        # Roles allowed to permanently delete and empty trash.
        # Type: list of strings
        # Default: ["admin"]
        admin_roles:
          - "admin"

      # -----------------------------------------------------------------------
      # Sharing / Public Links
      # -----------------------------------------------------------------------

      # Sharing configuration. Omit or set enabled: false to disable sharing.
      # Type: object (optional)
      sharing:
        # Whether time-limited public download links are enabled.
        # Type: boolean
        # Default: false
        enabled: true

        # Secret for signing and verifying share links (use ${ENV_VAR}).
        # Type: string
        # Required when sharing.enabled is true.
        signing_secret: "${FILE_SHARING_SECRET}"

        # Default TTL for share links in seconds.
        # Type: integer
        # Default: 86400 (24 hours)
        default_ttl: 86400

        # Maximum TTL for share links in seconds.
        # Type: integer
        # Default: 604800 (7 days)
        max_ttl: 604800

        # Store prefix for publicly accessible files.
        # Sharing creates a PHYSICAL COPY in {store_root}/{prefix}/{token}/{path}.
        # If the original is trashed or moved, the shared copy remains intact
        # (independent copy). Token is a unique identifier for the share link.
        # Type: string
        # Default: "shared"
        prefix: "shared"

        # Whether any authenticated user can create share links.
        # If false, only users with the role in required_link_role can create links.
        # Type: boolean
        # Default: true
        allow_any_user: true

        # Role required to create share links (only used when allow_any_user is false).
        # Type: string or null
        # Default: null
        required_link_role: null

      # -----------------------------------------------------------------------
      # Listing Configuration (pagination, sorting, filtering)
      # -----------------------------------------------------------------------

      # Pagination configuration for the metadata listing API.
      # Type: object (optional)
      pagination:
        # Whether pagination is enabled.
        # Type: boolean
        # Default: true
        enabled: true

        # Default page size.
        # Type: integer
        # Default: 20
        default_page_size: 20

        # Maximum allowed page size.
        # Type: integer
        # Default: 100
        max_page_size: 100

      # Sorting configuration for the metadata listing API.
      # Type: object (optional)
      sorting:
        # Whether sorting is enabled.
        # Type: boolean
        # Default: true
        enabled: true

        # Default sort field.
        # Type: string
        # Default: "created_at"
        default_field: "created_at"

        # Default sort order: "asc" or "desc".
        # Type: enum (string)
        # Default: "desc"
        default_order: "desc"

        # Fields that can be sorted on.
        # Type: list of strings. Use ["*"] for all.
        # Default: ["*"]
        allowed_fields:
          - "original_name"
          - "mime_type"
          - "created_at"
          - "size"
          - "content_type"

      # Filtering configuration for the metadata listing API.
      # Type: object (optional)
      filtering:
        # Whether filtering is enabled.
        # Type: boolean
        # Default: true
        enabled: true

        # Fields that can be filtered on.
        # Type: list of strings.
        allowed_fields:
          - "mime_type"
          - "original_name"
          - "created_at"
          - "size"
          - "content_type"
          - "tags"

      # Faceted search configuration (for media library UI).
      # Type: list of objects (optional)
      # Each object has: name (string), field (string), facet_type (string: "term", "date_range", "numeric")
      facets:
        - name: "type"
          field: "content_type"
          facet_type: "term"
        - name: "date"
          field: "created_at"
          facet_type: "date_range"
        - name: "size"
          field: "size"
          facet_type: "numeric"

      # -----------------------------------------------------------------------
      # Image Resize
      # -----------------------------------------------------------------------

      # Image resize configuration. Omit or set enabled: false to disable.
      # Type: object (optional)
      image_resize:
        # Whether on-demand image resizing is enabled.
        # Type: boolean
        # Default: false
        enabled: true

        # Maximum dimension (width or height) for auto-resize.
        # Images larger than this will be scaled down.
        # Type: integer (pixels)
        # Default: 4096
        max_dimension: 4096

        # Supported formats for image conversion.
        # Type: list of strings
        # Default: ["jpg", "jpeg", "png", "webp"]
        supported_formats:
          - "jpg"
          - "jpeg"
          - "png"
          - "webp"

        # Default resize fit mode: "scale_down", "cover", "contain".
        # Type: enum (string)
        # Default: "scale_down"
        default_fit: "scale_down"

        # Cache directory/prefix for resized images within the store.
        # Full path: {store_root}/{cache_dir}/{media_id}/{style_name}.{format}.
        # For cloud stores (S3/Azure/GCS): resized images are stored in the
        # cloud backend (same store), NOT local filesystem.
        # If not set, resized images are computed on each request.
        # Type: string
        # Default: null
        cache_dir: "_resized"

        # Named image styles for pre-generated thumbnails.
        # Type: list of objects (optional)
        # Each object has: name (string), max_width (int), max_height (int),
        #   resize_fit (string: "scale_down", "cover", "contain"),
        #   format (string), quality (int 0-100)
        styles:
          - name: "thumbnail"
            max_width: 200
            max_height: 200
            resize_fit: "cover"
            format: "webp"
            quality: 85
          - name: "gallery"
            max_width: 800
            max_height: 600
            resize_fit: "contain"
            format: "jpg"
            quality: 90

        # Whether to generate image styles automatically on upload.
        # Type: boolean
        # Default: false
        generate_on_upload: true

    # Authentication and authorization for this endpoint.
    auth: "jwt"
    roles:
      - "admin"
      - "editor"
      - "author"

  # ---- Static File Serving Example ----
  # Serves files directly from a storage backend with no database layer.
  # Supports optional upload, streaming, and image resize capabilities.
  - path: "/assets"
    # HTTP methods this endpoint responds to.
    # Type: list of strings (GET, POST, PUT, PATCH, DELETE)
    # Required.
    methods:
      - "get"
      - "head"

    # Action type.
    # Type: enum (string)
    # Required.
    action: "static_files"
    static_files:
      # Which named store to use (must match a key in `stores`).
      # The store's `root` field becomes the effective serving root for native stores.
      # For cloud stores, the "root" is conceptual (the bucket/container itself).
      # Type: string
      # Required.
      # Validation: referenced store must exist in `stores`; fails at config load time
      # with error: Store "X" referenced by endpoint "Y" does not exist
      storage: "local_assets"

      # -----------------------------------------------------------------------
      # Serving Configuration
      # -----------------------------------------------------------------------

      # Default index file for directory requests.
      # Type: string
      # Default: "index.html"
      index: "index.html"

      # Whether to show directory listings when no index file is found.
      # Type: boolean
      # Default: false
      directory_listing: false

      # Default Cache-Control max-age in seconds. 0 disables caching.
      # Type: integer
      # Default: 3600
      cache_max_age: 3600

      # ETag generation for cache validation.
      # Type: boolean
      # Default: true
      etag: true

      # Support for HTTP range requests (partial content / 206).
      # Type: boolean
      # Default: true
      range_requests: true

      # Support for HTTP HEAD method.
      # Type: boolean
      # Default: true
      head_support: true

      # Per-extension Cache-Control rules. Overrides cache_max_age for matching extensions.
      # Type: list of objects (optional)
      # Each object has: extensions (list of strings), cache_control (string)
      cache_rules:
        - extensions: [".html"]
          cache_control: "no-cache"
        - extensions: [".jpg", ".png", ".gif", ".webp", ".svg"]
          cache_control: "public, max-age=31536000, immutable"
        - extensions: [".mp4", ".mp3"]
          cache_control: "public, max-age=86400"

      # -----------------------------------------------------------------------
      # File Upload (optional capability)
      # -----------------------------------------------------------------------

      # Upload configuration. Omit or set enabled: false to disable uploads.
      # Type: object (optional)
      upload:
        # Whether file uploads are enabled for this endpoint.
        # Type: boolean
        # Default: false
        enabled: false

        # Maximum upload size in bytes.
        # Type: integer
        # Default: 10485760 (10 MiB)
        max_size: 10485760

        # Allowed file extensions (empty = all extensions allowed).
        # Type: list of strings (file extensions starting with a dot, e.g. ".jpg")
        # Default: [] (all extensions)
        allowed_extensions:
          - ".jpg"
          - ".jpeg"
          - ".png"
          - ".gif"
          - ".pdf"

        # Subdirectory pattern for organizing uploads.
        # Available placeholders: {user_id}, {year}, {month}, {day}, {uuid}
        # Type: string
        # Default: null (files stored at root of store)
        create_subdirectory: "{user_id}/{year}/{month}"

        # MIME type detection method: "extension" or "magic".
        # Type: enum (string)
        # Default: "magic"
        mime_detection: "magic"

      # -----------------------------------------------------------------------
      # Streaming (optional capability)
      # -----------------------------------------------------------------------

      # Streaming configuration. Omit or set enabled: false to disable.
      # Type: object (optional)
      streaming:
        # Whether chunked streaming for large files is enabled.
        # Type: boolean
        # Default: false
        enabled: false

        # Chunk size in bytes for streaming.
        # Type: integer (bytes)
        # Default: 65536 (64 KiB)
        buffer_size: 65536

        # Files larger than this threshold use streaming (smaller files are
        # read entirely into memory).
        # Type: integer (bytes)
        # Default: 1048576 (1 MiB)
        threshold: 1048576

        # Include Content-Length header in the response.
        # Type: boolean
        # Default: true
        include_content_length: true

      # -----------------------------------------------------------------------
      # Image Resize (optional capability)
      # -----------------------------------------------------------------------

      # Image resize configuration. Omit or set enabled: false to disable.
      # Type: object (optional)
      image_resize:
        # Whether on-demand image resizing is enabled.
        # Type: boolean
        # Default: false
        enabled: false

        # Maximum dimension (width or height) for auto-resize.
        # Images larger than this will be scaled down.
        # Type: integer (pixels)
        # Default: 4096
        max_dimension: 4096

        # Supported formats for image conversion.
        # Type: list of strings
        # Default: ["jpg", "jpeg", "png", "webp"]
        supported_formats:
          - "jpg"
          - "jpeg"
          - "png"
          - "webp"

        # Default resize fit mode: "scale_down", "cover", "contain".
        # Type: enum (string)
        # Default: "scale_down"
        default_fit: "scale_down"

        # Cache directory/prefix for resized images within the store.
        # If not set, resized images are computed on each request.
        # Type: string
        # Default: null
        cache_dir: null

  # ---- SPA Host Example ----
  # Serves a single-page application with automatic fallback routing.
  # Non-existent paths and directory listings fall through to the index file.
  # No directory browsing is exposed -- all requests resolve to the SPA entry point.
  - path: "/app/*"
    # HTTP methods this endpoint responds to.
    # Type: list of strings (GET, HEAD)
    # Required.
    methods:
      - "get"
      - "head"

    # Action type.
    # Type: enum (string)
    # Required.
    action: "spa_host"
    spa_host:
      # Which named store to use (must match a key in `stores`).
      # The store's `root` field becomes the effective serving root for native stores.
      # For cloud stores, the "root" is conceptual (the bucket/container itself).
      # Type: string
      # Required.
      # Validation: referenced store must exist in `stores`; fails at config load time
      # with error: Store "X" referenced by endpoint "Y" does not exist
      storage: "local_assets"

      # Index file for SPA fallback. Only needs to be specified if non-default.
      # Type: string
      # Default: "index.html"
      index: "index.html"

      # Default Cache-Control max-age in seconds for served files.
      # Type: integer
      # Default: 3600
      cache_max_age: 3600

      # Per-extension Cache-Control rules. Overrides cache_max_age for matching extensions.
      # Type: list of objects (optional)
      # Each object has: extensions (list of strings), cache_control (string)
      cache_rules:
        - extensions: [".html"]
          cache_control: "no-cache, no-store"
        - extensions: [".js", ".css", ".woff2", ".png", ".svg"]
          cache_control: "public, max-age=31536000, immutable"

      # ETag generation for cache validation.
      # Type: boolean
      # Default: true
      etag: true

      # HTTP status code for SPA fallback responses (non-existent paths).
      # Type: integer
      # Default: 200
      fallback_status: 200

    # Authentication provider name or "none".
    # Type: string
    # Default: "none"
    auth: "jwt"

  # ---- File Store Example ----
  # Database-backed file catalog. Manages a table as a file registry
  # with CRUD operations, ownership tracking, and metadata.
  # File serving is not handled by this action. To serve files from the
  # same store, configure a separate `static_files` endpoint pointing
  # at the same store.
  - path: "/api/files"
    # HTTP methods this endpoint responds to.
    # Type: list of strings (GET, POST, PUT, PATCH, DELETE)
    # Required.
    methods:
      - "get"
      - "post"
      - "patch"
      - "delete"

    # Action type.
    # Type: enum (string)
    # Required.
    action: "file_store"
    file_store:
      # Which named store to use (must match a key in `stores`).
      # The store's `root` field becomes the effective root for native stores.
      # For cloud stores, the "root" is conceptual (the bucket/container itself).
      # Type: string
      # Required.
      # Validation: referenced store must exist in `stores`; fails at config load time
      storage: "media_storage"

      # Database table that serves as the file registry.
      # Type: string
      # Required.
      # Validation: referenced table must exist in `tables`; fails at config load time
      table: "files"

      # Which named database to use (must match a key in `databases`).
      # Type: string
      # Required.
      # Validation: referenced database must exist in `databases`; fails at config load time
      database: "main"

      # File metadata columns tracked by the registry.
      # Same structure as media.metadata_columns.
      # Type: list of objects (optional)
      # Each object has: name (string), type (string), nullable (boolean, default: true),
      #   default (string, optional)
      metadata_columns:
        - name: "original_name"
          type: "text"
        - name: "mime_type"
          type: "text"
        - name: "size"
          type: "bigint"
        - name: "uploader_id"
          type: "uuid"
        - name: "tags"
          type: "jsonb"
          nullable: true
          default: "null"
        - name: "description"
          type: "text"
          nullable: true
          default: "null"
        - name: "alt_text"
          type: "text"
          nullable: true
          default: "null"

      # Field-level permissions for reading and writing metadata.
      # Type: object (optional) - HashMap<String, { read: Vec<RoleName>, write: Vec<RoleName> }>
      # key = column name, both `read` and `write` are REQUIRED sub-keys
      # For auto-generated columns NOT listed (id, created_at, updated_at, uploader_id):
      #   implicitly read: ["*"] (all roles), write: [] (no roles)
      field_permissions:
        original_name:
          read: ["admin", "editor"]
          write: ["admin"]
        mime_type:
          read: ["admin", "editor", "author"]
          write: ["admin"]
        tags:
          read: ["admin", "editor"]
          write: ["admin", "editor"]
        description:
          read: ["admin", "editor"]
          write: ["admin", "editor", "author"]
        alt_text:
          read: ["admin", "editor"]
          write: ["admin", "editor", "author"]

      # Row-level authorization via an owner column.
      # Type: object (optional)
      ownership:
        # Column name that stores the owner ID.
        owner_column: "uploader_id"
        # Admin users can access any row.
        admin_override: true

      # Trash support for deleted file registry entries.
      # Type: object (optional)
      trash:
        enabled: true
        retention_days: 30

      # Pagination for listing files.
      # Type: object (optional)
      pagination:
        enabled: true
        default_page_size: 20
        max_page_size: 100

      # Sorting for listing files.
      # Type: object (optional)
      sorting:
        enabled: true
        default_field: "created_at"
        default_order: "desc"
        allowed_fields:
          - "original_name"
          - "mime_type"
          - "created_at"
          - "size"

      # Filtering for listing files.
      # Type: object (optional)
      filtering:
        enabled: true
        allowed_fields:
          - "mime_type"
          - "original_name"
          - "created_at"
          - "size"

    # Authentication provider name or "none".
    # Type: string
    # Default: "none"
    auth: "jwt"
    # Allowed roles.
    roles:
      - "admin"

  # ---- Custom Response Example ----
  - path: "/api/info"
    # HTTP methods this endpoint responds to.
    # Type: list of strings (GET)
    # Required.
    methods:
      - "get"

    # Action type.
    # Type: enum (string)
    # Required.
    action: "custom_response"

    # Custom response configuration (required when action is "custom_response").
    custom_response:
      # HTTP status code.
      # Type: integer
      # Default: 200
      status: 200

      # Response content type.
      # Type: string
      # Default: "application/json"
      content_type: "application/json"

      # Response body (inline string).
      # Type: string
      body: '{"name": "Main Serve", "version": "0.3.0"}'

      # Response headers to include.
      # Type: map of string to string
      # Default: {}
      headers:
        X-Custom-A: "hello"
        X-Custom-B: "world"

    # Authentication provider name or "none".
    # Type: string
    # Default: "none"
    auth: "none"
