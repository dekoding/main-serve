# =============================================================================
# Schema validation
# =============================================================================
# Validation helps ensure that your schema is configured properly. If you
# cloned the Main Serve repository, there is a local copy of the schema that
# you can use by removing one # from the line below:
#
# yaml-language-server: $schema=../main-serve.schema.json
#
# If you prefer to use the schema from the online repository, you can remove
# one # from this line instead:
#
## yaml-language-server: $schema=https://raw.githubusercontent.com/dekoding/main-serve/refs/heads/main/config/main-serve.schema.json

# =============================================================================
# Quickstart
# =============================================================================
# You can use this configuration file as a template to get started.
#
# By default, Main Serve looks for configuration files in two places (in order
# of priority):
#
#   * $HOME/.config/main-serve/config.yaml
#   * /etc/main-serve/config.yaml
#
# It can also be explicitly loaded from any location:
#   MAIN_SERVE_ADMIN_TOKEN=my-secret-token main-serve -c /path/to/config.yaml

# =============================================================================
# Static File Serving with Uploads
# =============================================================================
# This template extends the basic static file serving configuration with
# support for file uploads, user-scoped directories, and image resizing. It
# includes example endpoints for general uploads, user-specific files, team
# files with access control, and a public CDN with image scaling.

server:
  host: "127.0.0.1"
  port: 0                       # 0 = pick a random available port
  max_body_size: 1048576        # 1 MiB - only matters for upload endpoints

logging:
  level: "warn"
  format: "json"

# Allow any origin for static assets. Tighten this for production.
cors:
  allowed_origins: ["*"]
  allowed_methods: ["GET", "HEAD", "OPTIONS"]
  max_age: 3600

# =============================================================================
# Storage backends
# =============================================================================
stores:
  uploads:
    backend: "native"
    root: "./uploads"
  user_uploads:
    backend: "native"
    root: "./user-uploads"
  team_files:
    backend: "native"
    root: "./team-files"
  cdn_assets:
    backend: "native"
    root: "./cdn-assets"

# =============================================================================
# Endpoints
# =============================================================================
endpoints:
  - path: "/uploads/*"
    methods:
      - "get"
      - "post"
      - "delete"
    action: "static_files"
    static_files:
      storage: "uploads"
      upload:
        enabled: true
        max_size: 10485760  # 10 MiB
        allowed_extensions:
          - ".jpg"
          - ".jpeg"
          - ".png"
          - ".gif"
          - ".pdf"
        create_subdirectory: "{user_id}/{year}/{month}"
      streaming:
        enabled: true
        buffer_size: 65536
        threshold: 1048576
    auth: "jwt"
    roles:
      - "admin"
      - "user"

  # User-Scoped Personal Files
  - path: "/my-files/*"
    methods:
      - "get"
      - "post"
      - "delete"
    action: "static_files"
    static_files:
      storage: "user_uploads"
      upload:
        enabled: true
        max_size: 5242880  # 5 MiB
        allowed_extensions:
          - ".jpg"
          - ".jpeg"
          - ".png"
          - ".gif"
        create_subdirectory: "{user_id}"
    auth: "jwt"

  # Team Files with Image Scaling
  - path: "/team-files/*"
    methods:
      - "get"
      - "post"
    action: "static_files"
    static_files:
      storage: "team_files"
      upload:
        enabled: true
        max_size: 20971520  # 20 MiB
        create_subdirectory: "{user_id}/{team_id}"
      image_resize:
        enabled: true
        max_dimension: 4096
        supported_formats:
          - "jpg"
          - "jpeg"
          - "png"
          - "webp"
      streaming:
        enabled: true
        buffer_size: 65536
        threshold: 1048576
    auth: "jwt"
    roles:
      - "viewer"
      - "editor"

  # Public CDN with Image Scaling
  - path: "/assets/*"
    methods:
      - "get"
    action: "static_files"
    static_files:
      storage: "cdn_assets"
      streaming:
        enabled: true
        buffer_size: 131072  # 128 KiB
      image_resize:
        enabled: true
        max_dimension: 2048
        supported_formats:
          - "jpg"
          - "jpeg"
          - "png"
          - "webp"
    auth: "none"
