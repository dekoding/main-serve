## yaml-language-server: $schema=https://raw.githubusercontent.com/dekoding/schemas/refs/heads/main/main-serve.json
# To enable schema enforcement and completion, remove one # from the line above
# 
# =============================================================================
# Static File Serving with Uploads
# =============================================================================
# This template extends the basic static file serving configuration with
# support for file uploads, user-scoped directories, and image resizing. It
# includes example endpoints for general uploads, user-specific files, team
# files with access control, and a public CDN with image scaling.
#
# Getting started:
#   1. Replace {ROOT} below with the absolute path to your web root, e.g. /var/www/html or ./dist
#   2. Configure the upload settings, user scopes, and image resizing options as needed.
#   3. Run:  main-serve --config config/templates/static_files_with_uploads.yaml
# Placeholder: {ROOT} - absolute path to the directory containing your files.
#              (Replaced automatically when running the integration tests.)
server:
  host: "127.0.0.1"
  port: 0                       # 0 = pick a random available port
  max_body_size: 1048576        # 1 MiB - only matters for upload endpoints

logging:
  level: "warn"
  format: "json"

# Allow any origin for static assets. Tighten this for production.
cors:
  allowed_origins: ["*"]
  allowed_methods: ["GET", "HEAD", "OPTIONS"]
  max_age: 3600

# =============================================================================
# Endpoints
# =============================================================================
endpoints:
  - path: "/uploads/*"
    methods:
      - "get"
      - "post"
      - "delete"
    action: "static"
    static_files:
      root: "./uploads"
      upload:
        enabled: true
        max_size: 10485760  # 10 MiB
        allowed_extensions:
          - "jpg"
          - "jpeg"
          - "png"
          - "gif"
          - "pdf"
        create_subdirectory: "{user_id}/{year}/{month}"
        required_role: "admin"
      streaming:
        enabled: true
        buffer_size: 65536
        threshold: 1048576
    auth: "jwt"
    roles:
      - "admin"
      - "user"

  # User-Scoped Personal Files
  - path: "/my-files/*"
    methods:
      - "get"
      - "post"
      - "delete"
    action: "static"
    static_files:
      root: "./user-uploads"
      upload:
        enabled: true
        max_size: 5242880  # 5 MiB
        allowed_extensions:
          - "jpg"
          - "jpeg"
          - "png"
          - "gif"
        create_subdirectory: "{user_id}"
      user_scope:
        enabled: true
        required_role: null
        directory_pattern: "{user_id}"
        expose_root: false
    auth: "jwt"

  # Team Files with Image Scaling
  - path: "/team-files/*"
    methods:
      - "get"
      - "post"
    action: "static"
    static_files:
      root: "./team-files"
      upload:
        enabled: true
        max_size: 20971520  # 20 MiB
        create_subdirectory: "{user_id}/{team_id}"
        required_role: "editor"
      user_scope:
        enabled: true
        required_role: "viewer"
        directory_pattern: "{team_id}/{user_id}"
        expose_root: true
      image_resize:
        enabled: true
        max_dimension: 4096
        supported_formats:
          - "jpg"
          - "jpeg"
          - "png"
          - "webp"
      streaming:
        enabled: true
        buffer_size: 65536
        threshold: 1048576
    auth: "jwt"
    roles:
      - "viewer"
      - "editor"

  # Public CDN with Image Scaling
  - path: "/assets/*"
    methods:
      - "get"
    action: "static"
    static_files:
      root: "./cdn-assets"
      streaming:
        enabled: true
        buffer_size: 131072  # 128 KiB
      image_resize:
        enabled: true
        max_dimension: 2048
        supported_formats:
          - "jpg"
          - "jpeg"
          - "png"
          - "webp"
    auth: "none"