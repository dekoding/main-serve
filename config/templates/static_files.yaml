# =============================================================================
# Schema validation
# =============================================================================
# Validation helps ensure that your schema is configured properly. If you
# cloned the Main Serve repository, there is a local copy of the schema that
# you can use by removing one # from the line below:
#
## yaml-language-server: $schema=../main-serve.schema.json
#
# If you prefer to use the schema from the online repository, you can remove
# one # from this line instead:
#
## yaml-language-server: $schema=https://raw.githubusercontent.com/dekoding/main-serve/refs/heads/main/config/main-serve.schema.json

# =============================================================================
# Quickstart
# =============================================================================
# You can use this configuration file as a template to get started.
#
# By default, Main Serve looks for configuration files in two places (in order
# of priority):
#
#   * $HOME/.config/main-serve/config.yaml
#   * /etc/main-serve/config.yaml
#
# It can also be explicitly loaded from any location:
#   MAIN_SERVE_ADMIN_TOKEN=my-secret-token main-serve -c /path/to/config.yaml

# =============================================================================
# Static File Serving
# =============================================================================
#
# Three common modes for serving files from disk:
#
#   /assets/*   Standard serving.  Returns the file if it exists, 404 otherwise.
#               Ideal for images, CSS, JS bundles, and other hashed assets where
#               you want aggressive caching (cache_max_age: 86400 = 1 day).
#
#   /app/*      Single-Page App (SPA).  Any path that doesn't match a real file
#               returns index.html so your client-side router can handle it.
#               Caching is disabled (cache_max_age: 0) because the HTML shell
#               must always be fresh.
#
#   /files/*    Directory listing.  When a folder has no index file the server
#               renders a browsable file listing. Useful for download portals or
#               internal file shares.
#
# Use the $ prefix to interpolate environment variables (e.g. $ROOT).

server:
  host: "127.0.0.1"
  port: 0                       # 0 = pick a random available port
  max_body_size: 1048576        # 1 MiB - only matters for upload endpoints

logging:
  level: "warn"
  format: "json"

# Allow any origin for static assets. Tighten this for production.
cors:
  allowed_origins: ["*"]
  allowed_methods: ["GET", "HEAD", "OPTIONS"]
  max_age: 3600

# =============================================================================
# Storage backends
# =============================================================================
stores:
  static_assets:
    backend: "native"
    root: "./public"

# =============================================================================
# Endpoints
# =============================================================================
endpoints:

  # Standard static serving
  # Serves files verbatim.  Missing paths return 404.
  - path: "/assets/*"
    methods: ["get"]
    action: "static_files"
    static_files:
      storage: "static_assets"
      index: "index.html"        # served when the path ends in /
      directory_listing: false    # never expose folder contents
      cache_max_age: 86400       # 1 day - tune per deployment strategy
    auth: "none"

  # SPA mode
  # Unknown paths fall through to index.html for client-side routing
  # (React Router, Vue Router, etc.).
  - path: "/app/*"
    methods: ["get"]
    action: "spa_host"
    spa_host:
      storage: "static_assets"
      index: "index.html"
      cache_max_age: 0            # never cache the HTML shell
    auth: "none"

  # Directory listing
  # When a folder has no index file the server generates an HTML listing.
  - path: "/files/*"
    methods: ["get"]
    action: "static_files"
    static_files:
      storage: "static_assets"
      index: "index.html"
      directory_listing: true     # enable browsable listings
      cache_max_age: 0
    auth: "none"
