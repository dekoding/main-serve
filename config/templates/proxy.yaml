# =============================================================================
# Schema validation
# =============================================================================
# Validation helps ensure that your schema is configured properly. If you
# cloned the Main Serve repository, there is a local copy of the schema that
# you can use by removing one # from the line below:
#
## yaml-language-server: $schema=../main-serve.schema.json
#
# If you prefer to use the schema from the online repository, you can remove
# one # from this line instead:
#
## yaml-language-server: $schema=https://raw.githubusercontent.com/dekoding/main-serve/refs/heads/main/config/main-serve.schema.json

# =============================================================================
# Quickstart
# =============================================================================
# You can use this configuration file as a template to get started.
#
# By default, Main Serve looks for configuration files in two places (in order
# of priority):
#
#   * $HOME/.config/main-serve/config.yaml
#   * /etc/main-serve/config.yaml
#
# It can also be explicitly loaded from any location:
#   MAIN_SERVE_ADMIN_TOKEN=my-secret-token main-serve -c /path/to/config.yaml

# =============================================================================
# Reverse Proxy - Forward Requests to Upstream Services
# =============================================================================
#
# Use `action: "proxy"` to forward incoming requests to an upstream HTTP
# service.  Main Serve rewrites paths, injects headers, and enforces
# per-endpoint timeouts - no code required.
#
# Common use cases:
#   * API gateway in front of microservices
#   * Legacy backend migration (old paths -> new upstream)
#   * Adding auth / rate limiting in front of an unprotected service
#
# Features demonstrated here:
#
#   /api/v1/*        Pass-through proxy with path_rewrite (strip /api/v1,
#                    add /v1) and custom request headers.
#   /legacy/*        Rewrite legacy paths: strip /legacy, add /api/v2.
#   /external/time   Proxy to an external API with tight timeouts.
#
# Placeholder (use your real upstream in production):
#   __UPSTREAM_URL__ -> e.g. http://localhost:3000

server:
  host: "127.0.0.1"
  port: 0

logging:
  level: "warn"
  format: "json"

cors:
  allowed_origins: ["*"]
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  max_age: 3600

# =============================================================================
# Endpoints
# =============================================================================
endpoints:

  # API gateway
  # Incoming:  GET /api/v1/users?active=true
  # Upstream:  GET __UPSTREAM_URL__/v1/users?active=true
  #
  # strip_prefix removes "/api/v1" -> "/users?active=true"
  # add_prefix   prepends "/v1"    -> "/v1/users?active=true"
  - path: "/api/v1/*"
    methods: ["get", "post", "put", "delete"]
    action: "proxy"
    proxy:
      upstream: "__UPSTREAM_URL__"
      path_rewrite:
        strip_prefix: "/api/v1"
        add_prefix: "/v1"
      headers:
        X-Forwarded-By: "main-serve"
        X-Request-Source: "gateway"
      timeouts:
        connect: 5
        read: 30
        total: 60
      max_response_size: 10485760   # 10 MiB - reject larger payloads
    auth: "none"

  # Legacy path migration
  # Incoming:  GET /legacy/widgets
  # Upstream:  GET __UPSTREAM_URL__/api/v2/widgets
  - path: "/legacy/*"
    methods: ["get"]
    action: "proxy"
    proxy:
      upstream: "__UPSTREAM_URL__"
      path_rewrite:
        strip_prefix: "/legacy"
        add_prefix: "/api/v2"
      timeouts:
        connect: 3
        read: 15
        total: 20
      max_response_size: 52428800    # 50 MiB
    auth: "none"

  # External API with tight timeouts
  # No path rewrite - proxied as-is.
  - path: "/external/time"
    methods: ["get"]
    action: "proxy"
    proxy:
      upstream: "__UPSTREAM_URL__"
      max_response_size: 1048576     # 1 MiB
      timeouts:
        connect: 2
        read: 5
        total: 8
    auth: "none"
